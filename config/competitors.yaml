# Competitor Store Registry
#
# shop_id format: {market_code}{competitor_initial}{seq:05d}
#   market_code        : 2-letter code  (HK, TH, VN, MC, SG, KH, LA, MY)
#   competitor_initial : 1-letter code  (M=McDonald's, C=CHANGEE, S=Sushiro, L=Luckin)
#   seq                : 5-digit zero-padded sequence (per competitor-market, 1-indexed)
#
# Example: HKM00001 = McDonald's HK, shop #1
#
# scraper_class options:
#   McDonaldsScraper | ChangeeScraper | SushiroScraper | LuckinScraper
#
# enabled: false → skipped at runtime (no website / no presence in that market)

competitors:

  # ─── McDonald's ───────────────────────────────────────────────────────────
  - market_code: "HK"
    competitor_name: "McDonald's"
    competitor_initial: "M"
    scraper_class: McDonaldsScraper
    url: "https://mcdonalds.com.hk/en/find-a-restaurant/"
    enabled: true

  - market_code: "TH"
    competitor_name: "McDonald's"
    competitor_initial: "M"
    scraper_class: McDonaldsScraper
    url: "https://www.mcdonalds.co.th/storeLocations"
    enabled: true

  - market_code: "VN"
