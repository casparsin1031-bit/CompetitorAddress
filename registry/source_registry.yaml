# Agent-maintained competitor source registry
#
# Purpose
# -------
# This file is the durable record the agent uses to decide whether a monthly
# competitor-store refresh is trustworthy enough to maintain automatically.
#
# Rules
# -----
# - Prefer official store locators / official app endpoints.
# - If official source is absent, blocked, or returns implausible results, use
#   secondary sources such as Google Maps, OpenRice, Grab, Keeta, mall
#   directories, or official social/press pages as evidence.
# - A monthly cron may commit/publish output only when sanity checks pass.
# - Zero-store results and significant drops are exceptions requiring review.
#
# Count ranges below are intentionally broad initial guardrails. They should be
# tightened as monthly history accumulates.

entries:
  - market_code: HK
    competitor_name: "McDonald's"
    competitor_initial: M
    enabled: true
    expected_store_count:
      min: 150
      max: 350
    significant_drop_pct: 0.35
    source_priority:
      - type: official
        url: "https://mcdonalds.com.hk/en/find-a-restaurant/"
        status: active
        confidence: high
      - type: google_maps
        query: "McDonald's Hong Kong"
        status: fallback
        confidence: medium
    verification_notes:
      - "2026-07-05: existing Playwright scraper returned 0 stores; treat this as a hard exception and use fallback discovery before monthly maintenance."

